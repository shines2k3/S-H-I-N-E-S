```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insight Cosmetics Skin Tint 5 In 1 Serum Foundation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    padding: 20px;
}

.product {
    max-width: 1100px;
    margin: auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    display: flex;
    gap: 40px;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
}

.product-image {
    width: 100%;
    max-width: 380px;
    border-radius: 10px;
    display: block;
    margin: auto;
}

.details {
    flex: 1;
}

h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.price {
    margin: 15px 0;
    font-size: 20px;
}

.price del {
    color: #888;
    margin-right: 10px;
}

.price span {
    color: #e91e63;
    font-size: 30px;
    font-weight: bold;
}

.selected-shade {
    margin-top: 15px;
    font-size: 16px;
}

.shade-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 15px;
    max-width: 500px;
}

.shade-item {
    width: 75px;
    text-align: center;
    cursor: pointer;
}

.shade-item img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid transparent;
    display: block;
    margin: 0 auto 6px;
    transition: border-color 0.15s, transform 0.15s;
}

.shade-item:hover img {
    transform: scale(1.08);
}

.shade-item.active img {
    border-color: #e91e63;
}

.shade-item span {
    font-size: 11px;
    line-height: 1.2;
    display: block;
    color: #333;
}

.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 28px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
}

.btn:hover {
    opacity: 0.9;
    transform: scale(1.02);
}

.btn.sold-out {
    background: gray;
    pointer-events: none;
    cursor: not-allowed;
}

/* Mobile */
@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    .product {
        flex-direction: column;
        padding: 20px;
        gap: 25px;
    }

    .product-image {
        max-width: 280px;
    }

    h1 {
        font-size: 24px;
        text-align: center;
    }

    .price,
    .selected-shade {
        text-align: center;
    }

    .shade-grid {
        max-width: 100%;
        justify-content: center;
    }

    .btn {
        display: block;
        width: 100%;
        text-align: center;
    }
}

</style>

</head>

<body>

<div class="product">

    <!-- Main Product Image -->
    <div>
        <img
            id="productImage"
            class="product-image"
            src="insightfoundation/Brewtiful.jpeg"
            alt="Insight Cosmetics Skin Tint Foundation"
        >
    </div>

    <!-- Product Details -->
    <div class="details">

        <h1>
            Insight Cosmetics Skin Tint 5 In 1
            Multifunctional Serum Foundation
        </h1>

        <p class="price">
            <del>₹319</del>
            <span>₹290</span>
        </p>

        <p class="selected-shade">
            Selected Shade:
            <b id="shadeName">Brewtiful</b>
        </p>

        <br>

        <!-- Shade Selection -->
        <div class="shade-grid" id="shadeGrid">

            <!-- Brewtiful -->
            <div
                class="shade-item active"
                data-shade="Brewtiful"
            >
                <img
                    src="insightfoundation/Brewtiful.jpeg"
                    alt="Brewtiful"
                >
                <span>Brewtiful</span>
            </div>

            <!-- Filter Coffee -->
            <div
                class="shade-item"
                data-shade="Filter Coffee"
            >
                <img
                    src="insightfoundation/Filter Coffee.jpeg"
                    alt="Filter Coffee"
                >
                <span>Filter Coffee</span>
            </div>

            <!-- Chai & Chill -->
            <div
                class="shade-item"
                data-shade="Chai & Chill"
            >
                <img
                    src="insightfoundation/Chai & Chill.jpeg"
                    alt="Chai & Chill"
                >
                <span>Chai & Chill</span>
            </div>

            <!-- Vanilla Frappe -->
            <div
                class="shade-item"
                data-shade="Vanilla Frappe"
            >
                <img
                    src="insightfoundation/Vanilla Frappe.jpeg"
                    alt="Vanilla Frappe"
                >
                <span>Vanilla Frappe</span>
            </div>

            <!-- Cappucino - Sold Out -->
            <div
                class="shade-item"
                data-shade="Cappucino (Sold Out)"
            >
                <img
                    src="insightfoundation/Cappucino.jpeg"
                    alt="Cappucino"
                >
                <span>Cappucino</span>
            </div>

        </div>

        <br>

        <!-- WhatsApp Order Button -->
        <a
            id="orderBtn"
            class="btn"
            href="#"
            target="_blank"
        >
            Order on WhatsApp
        </a>

    </div>

</div>


<script>

/* ===============================
   SHADE IMAGES
================================ */

const shadeImages = {

    "Brewtiful":
        "insightfoundation/Brewtiful.jpeg",

    "Filter Coffee":
        "insightfoundation/Filter Coffee.jpeg",

    "Chai & Chill":
        "insightfoundation/Chai & Chill.jpeg",

    "Vanilla Frappe":
        "insightfoundation/Vanilla Frappe.jpeg",

    "Cappucino (Sold Out)":
        "insightfoundation/Cappucino.jpeg"

};


/* ===============================
   GET HTML ELEMENTS
================================ */

const shadeItems =
    document.querySelectorAll(".shade-item");

const img =
    document.getElementById("productImage");

const nameEl =
    document.getElementById("shadeName");

const btn =
    document.getElementById("orderBtn");


/* ===============================
   UPDATE PRODUCT
================================ */

function update(shade) {

    /* Change main image */
    img.src = shadeImages[shade];

    /* Change selected shade name */
    nameEl.textContent = shade;


    /* ===============================
       SOLD OUT CHECK
    ================================ */

    if (shade === "Cappucino (Sold Out)") {

        btn.innerHTML = "❌ SOLD OUT";

        btn.href = "#";

        btn.classList.add("sold-out");

    }

    else {

        btn.innerHTML = "Order on WhatsApp";

        btn.classList.remove("sold-out");


        /* ===============================
           WHATSAPP ORDER
        ================================ */

        const message =
            "Hi, I want to order Insight Cosmetics Skin Tint 5 In 1 Multifunctional Serum Foundation\n" +
            "Shade: " + shade;

        btn.href =
            "https://wa.me/919526112374?text=" +
            encodeURIComponent(message);

    }


    /* ===============================
       ACTIVE SHADE
    ================================ */

    shadeItems.forEach(function(item) {

        item.classList.remove("active");

        if (item.dataset.shade === shade) {
            item.classList.add("active");
        }

    });

}


/* ===============================
   SHADE CLICK EVENTS
================================ */

shadeItems.forEach(function(item) {

    item.addEventListener("click", function() {

        const selectedShade =
            item.dataset.shade;

        update(selectedShade);

    });

});


/* ===============================
   DEFAULT SHADE
================================ */

update("Brewtiful");

</script>

</body>

</html>
