<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nykaa Matte to Last No Transfer Long Lasting Lipstick</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.product{
max-width:1100px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
display:flex;
gap:40px;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.product img{
width:100%;
max-width:380px;
border-radius:10px;
display:block;
margin:auto;
}

.details{
flex:1;
}

h1{
font-size:32px;
margin-bottom:20px;
}

.price{
margin:15px 0;
font-size:20px;
}

.price del{
color:#888;
margin-right:10px;
}

.price span{
color:#e91e63;
font-size:30px;
font-weight:bold;
}

.shade-grid{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:10px;
max-width:420px;
}

.shade-item{
width:70px;
text-align:center;
cursor:pointer;
}

.shade-item img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid transparent;
display:block;
margin:0 auto 6px;
transition:border-color .15s, transform .15s;
}

.shade-item:hover img{
transform:scale(1.05);
}

.shade-item.active img{
border-color:#e91e63;
}

.shade-item span{
font-size:11px;
line-height:1.2;
display:block;
color:#333;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:#25D366;
color:#fff;
text-decoration:none;
border-radius:30px;
font-size:18px;
font-weight:bold;
}

@media(max-width:768px){

.product{
flex-direction:column;
padding:20px;
}

.product img{
max-width:280px;
}

h1{
font-size:24px;
text-align:center;
}

.price,
p{
text-align:center;
}

.shade-grid{
max-width:100%;
justify-content:center;
}

.btn{
display:block;
width:100%;
text-align:center;
}

}

</style>

</head>

<body>

<div class="product">

<img id="productImage"
src="nykaalipstick1/On Fire.jpeg"
alt="Nykaa Lipstick">

<div class="details">

<h1>Nykaa Matte to Last No Transfer Long Lasting Lipstick</h1>

<p class="price">
<del>₹599</del>
<span>₹470</span>
</p>

<p>
Selected Shade :
<b id="shadeName">Mum Taj</b>
</p>

<br>

<div class="shade-grid" id="shadeGrid">

<div class="shade-item active" data-shade="Mum Taj">
<img src="nykaalipstick1/Mum Taj.jpeg" alt="Mum Taj">
<span>Mum Taj</span>
</div>

<div class="shade-item" data-shade="Chai">
<img src="nykaalipstick1/Chai.jpeg" alt="Chai">
<span>Chai</span>
</div>

<div class="shade-item" data-shade="Maharani">
<img src="nykaalipstick1/Maharani.jpeg" alt="Maharani">
<span>Maharani</span>
</div>

<div class="shade-item" data-shade="Boho">
<img src="nykaalipstick1/Boho.jpeg" alt="Boho">
<span>Boho</span>
</div>

<div class="shade-item" data-shade="Bombae">
<img src="nykaalipstick1/Bombae.jpeg" alt="Bombae">
<span>Bombae</span>
</div>

<div class="shade-item" data-shade="Kashi">
<img src="nykaalipstick1/Kashi.jpeg" alt="Kashi">
<span>Kashi</span>
</div>

<div class="shade-item" data-shade="Madras Kaapi">
<img src="nykaalipstick1/Madras Kaapi.jpeg" alt="Madras Kaapi">
<span>Madras Kaapi</span>
</div>

<div class="shade-item" data-shade="Maithili">
<img src="nykaalipstick1/Maithili.jpeg" alt="Maithili">
<span>Maithili</span>
</div>

<div class="shade-item" data-shade="Jhumki">
<img src="nykaalipstick1/Jhumki.jpeg" alt="Jhumki">
<span>Jhumki</span>
</div>

<div class="shade-item" data-shade="Mishti">
<img src="nykaalipstick1/Mishti.jpeg" alt="Mishti">
<span>Mishti</span>
</div>

</div>

<br>

<a id="orderBtn" class="btn" href="#">
Order on WhatsApp
</a>

</div>

</div>
<script>
const shadeItems=document.querySelectorAll(".shade-item");
const img=document.getElementById("productImage");
const nameEl=document.getElementById("shadeName");
const btn=document.getElementById("orderBtn");

const shadeImages={

    "Mum Taj":"nykaalipstick1/Mum Taj.jpeg",
    "Chai":"nykaalipstick1/Chai.jpeg",
    "Maharani":"nykaalipstick1/Maharani.jpeg",
    "Boho":"nykaalipstick1/Boho.jpeg",
    "Bombae":"nykaalipstick1/Bombae.jpeg",
    "Kashi":"nykaalipstick1/Kashi.jpeg",
    "Madras Kaapi":"nykaalipstick1/Madras Kaapi.jpeg",
    "Maithili":"nykaalipstick1/Maithili.jpeg",
    "Jhumki":"nykaalipstick1/Jhumki.jpeg",
    "Mishti":"nykaalipstick1/Mishti.jpeg",

};

function update(s){

img.src=shadeImages[s];
nameEl.textContent=s;

shadeItems.forEach(function(item){
item.classList.toggle("active", item.dataset.shade===s);
});

btn.innerHTML="Order on WhatsApp";
btn.style.background="#25D366";
btn.style.pointerEvents="auto";

btn.href="https://wa.me/919946552836?text="+encodeURIComponent(
"Hi, I want to order Nykaa Matte to Last No Transfer Long Lasting Lipstick\nShade : "+s
);

}

shadeItems.forEach(function(item){
item.addEventListener("click",function(){
update(item.dataset.shade);
});
});

update("Mum Taj");

</script>

</body>
</html>
