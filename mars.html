<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARS Creamy Matte Lipstick</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.product{
max-width:1100px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
display:flex;
gap:40px;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.product img{
width:100%;
max-width:380px;
border-radius:10px;
display:block;
margin:auto;
}

.details{
flex:1;
}

h1{
font-size:32px;
margin-bottom:20px;
}

.price{
margin:15px 0;
font-size:20px;
}

.price del{
color:#888;
margin-right:10px;
}

.price span{
color:#e91e63;
font-size:30px;
font-weight:bold;
}

.shade-grid{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:10px;
max-width:420px;
}

.shade-item{
width:70px;
text-align:center;
cursor:pointer;
}

.shade-item img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid transparent;
display:block;
margin:0 auto 6px;
transition:border-color .15s, transform .15s;
}

.shade-item:hover img{
transform:scale(1.05);
}

.shade-item.active img{
border-color:#e91e63;
}

.shade-item span{
font-size:11px;
line-height:1.2;
display:block;
color:#333;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:#25D366;
color:#fff;
text-decoration:none;
border-radius:30px;
font-size:18px;
font-weight:bold;
}

@media(max-width:768px){

.product{
flex-direction:column;
padding:20px;
}

.product img{
max-width:280px;
}

h1{
font-size:24px;
text-align:center;
}

.price,
p{
text-align:center;
}

.shade-grid{
max-width:100%;
justify-content:center;
}

.btn{
display:block;
width:100%;
text-align:center;
}

}

</style>

</head>

<body>

<div class="product">

<img id="productImage" 
src="marslipstick/mars.jpeg"
alt="marslipstick">

<div class="details">

<h1>MARS Creamy Matte Lipstick</h1>

<p class="price">
<del>₹199</del> 
<span>₹179</span>

</p>
Selected Shade: 
<b id="shadeName">Bollywood Surprise</b>
</p>

<br>

<div class="shade-grid" id="shadeGrid">

<div class="shade-item active" data-shade="Bollywood Surprise">
<img src="marslipstick/Bollywood Surprise.jpeg" alt="Bollywood Surprise">
<span>Bollywood Surprise</span>
</div>

<div class="shade-item" data-shade="Disco Deewane">
<img src="marslipstick/Disco Deewane.jpeg" alt="Disco Deewane">
<span>Disco Deewane</span>
</div>

<div class="shade-item" data-shade="Zesty Zumba">
<img src="marslipstick/Zesty Zumba.jpeg" alt="Zesty Zumba">
<span>Zesty Zumba</span>
</div>

<div class="shade-item" data-shade="Aerial Awe">
<img src="marslipstick/Aerial Awe.jpeg" alt="Aerial Awe">
<span>Aerial Awe</span>
</div>

<div class="shade-item" data-shade="Khoobsurat Kuchipudi">
<img src="marslipstick/Khoobsurat Kuchipudi.jpeg" alt="Khoobsurat Kuchipudi">
<span>Khoobsurat Kuchipudi</span>
</div>

</div>
<br>
<a id="orderBtn" class="btn" href="#">
Order on WhatsApp
</a>

</div>

</div>
<script>
const shadeItems = document.querySelectorAll(".shade-item");
const img = document.getElementById("productImage");
const nameEl = document.getElementById("shadeName");
const btn = document.getElementById("orderBtn");

const shadeImages = {

    "Bollywood Surprise":"marslipstick/Bollywood Surprise.jpeg",
    "Disco Deewane":"marslipstick/Disco Deewane.jpeg",
    "Zesty Zumba":"marslipstick/Zesty Zumba.jpeg",
    "Aerial Awe":"marslipstick/Aerial Awe.jpeg",
    "Khoobsurat Kuchipudi":"marslipstick/Khoobsurat Kuchipudi.jpeg",
};

function update(s){

    img.src=shadeImages[s];
    nameEl.textContent=s;


shadeItems.forEach(function(item){
item.classList.toggle("active", item.dataset.shade===s);
});
    btn.innerHTML="Order on WhatsApp";
    btn.style.background="#25D366";
    btn.style.pointerEvents="auto";

    btn.href ="https://wa.me/919526112374?text=" +encodeURIComponent(
    "Hi, I want to order MARS Creamy Matte Lipstick\nShade: " + s
    );
}

shadeItems.forEach(function(item){
item.addEventListener("click",function(){
update(item.dataset.shade);
});
});

update("Bollywood Surprise");

</script>

</body>
</html>
